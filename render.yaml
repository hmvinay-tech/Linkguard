services:
  - type: web
    name: linkguard-api
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: APP_NAME
        value: LinkGuard
      - key: API_PREFIX
        value: /api
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: linkguard-db
          property: connectionString
      - key: BACKEND_CORS_ORIGINS
        value: http://localhost:5173,http://127.0.0.1:5173
      - key: BACKEND_CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app
      - key: SCHEDULED_SCANS_ENABLED
        value: true
      - key: SCHEDULED_SCAN_MINUTES
        value: 15
      - key: CRAWLER_TIMEOUT_SECONDS
        value: 10
      - key: CRAWLER_MAX_REDIRECTS
        value: 5
      - key: CRAWLER_MAX_RESPONSE_BYTES
        value: 1000000
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: ALERT_FROM_EMAIL
        sync: false
      - key: ALERT_TO_EMAIL
        sync: false
      - key: SMS_WEBHOOK_URL
        sync: false
      - key: SMS_WEBHOOK_TOKEN
        sync: false

databases:
  - name: linkguard-db
    plan: free
    region: oregon
    postgresMajorVersion: "18"
